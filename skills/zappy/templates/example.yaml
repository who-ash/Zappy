# One video = one spec. Run: zappy make example
title: A first look
startUrl: /
# auth: user          # a session saved with `zappy login user <url>`; omit to start signed out
# before: npm run seed:demo   # optional shell command run first (reset demo data)
# blur: [".user-email"]       # CSS selectors blurred on screen (private data)
steps:
  - action: wait
    value: 300
    zoom: false
    narration: This is the home page, where every visit starts.
  - action: hover
    selector: { role: link, name: Get started }
    narration: Press Get started to begin.
